<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the app draws under the notch, and pads itself. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      What crawlers and link previews read before JavaScript runs. %PUBLIC_URL%
      is replaced with the site's address when the BFF serves this file.
      Pages set their own title once the app has loaded (src/page-meta.ts).
    -->
    <title>Zbeul</title>
    <meta
      name="description"
      content="Zbeul, the game for afterparties : le jeu de soirée entre potes sur un seul téléphone, de l'apéro tranquille au très limite. Gratuit, sans compte, jouable sans connexion. Réservé aux adultes."
    />
    <link rel="canonical" href="%PUBLIC_URL%/" />
    <!--
      Icons: the SVG for browsers, favicon.ico (48, 32 and 16 px) for those
      that ask for it and for search results, and a 180 px square for phones'
      home screens. Regenerate them from icon.svg when the brand changes.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zbeul" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!--
      Link previews (Open Graph, read by most platforms, and X's card). Pages
      update these once the app has loaded (src/page-meta.ts); crawlers that
      don't run JavaScript see the home page's. Replace public/og-image.png
      (1200 × 630) with the project's own.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zbeul" />
    <meta property="og:title" content="Zbeul" />
    <meta
      property="og:description"
      content="The game for afterparties : un téléphone, des potes, et la soirée part en vrille."
    />
    <meta property="og:url" content="%PUBLIC_URL%/" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Le logo de Zbeul" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zbeul" />
    <meta
      name="twitter:description"
      content="The game for afterparties : un téléphone, des potes, et la soirée part en vrille."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Le logo de Zbeul" />
    <!-- Google Analytics' measurement id, filled by the BFF: empty means off. -->
    <meta name="ga-measurement-id" content="%GA_MEASUREMENT_ID%" />
    <!--
      Structured data: the site, and the organisation behind it, whose logo
      search results may show (a square image of at least 112 px).
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%PUBLIC_URL%/#website",
            "name": "Zbeul",
            "url": "%PUBLIC_URL%/",
            "inLanguage": "fr",
            "description": "Zbeul, the game for afterparties : le jeu de soirée entre potes sur un seul téléphone, de l'apéro tranquille au très limite. Gratuit, sans compte, jouable sans connexion. Réservé aux adultes.",
            "publisher": { "@id": "%PUBLIC_URL%/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "%PUBLIC_URL%/#organization",
            "name": "Zbeul",
            "url": "%PUBLIC_URL%/",
            "logo": "%PUBLIC_URL%/apple-touch-icon.png"
          }
        ]
      }
    </script>
    <!-- Before anything is drawn: the saved theme (public/theme.js). -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
